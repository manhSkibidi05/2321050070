        // btvn : tính điểm số -> điểm chữ từ điểm cho trước
        const tinhDiem = () => {
            const diemNhap = [
                document.getElementById('diemA').value.trim(),
                document.getElementById('diemB').value.trim(),
                document.getElementById('diemC').value.trim()
            ]

            if (diemNhap.some(diem => diem === '')) {
                document.getElementById('diemSo').textContent = 'Vui lòng nhập đầy đủ điểm'
                document.getElementById('diemChu').textContent = ''
                return
            }

            const [diemA, diemB, diemC] = diemNhap.map(Number)
            const diemHopLe = [diemA, diemB, diemC].every(
                diem => Number.isFinite(diem) && diem >= 0 && diem <= 10
            )

            if (!diemHopLe) {
                document.getElementById('diemSo').textContent = 'Điểm phải là số từ 0 đến 10'
                document.getElementById('diemChu').textContent = ''
                return
            }

            const diemSo = diemA * 0.6 + diemB * 0.3 + diemC * 0.1
            const diemChu = xepLoai(diemSo)
            document.getElementById('diemSo').textContent = diemSo
            document.getElementById('diemChu').textContent = diemChu
        }

        const xepLoai = (diemSo) => {
            if (diemSo === null || isNaN(diemSo)) return null
            if (diemSo >= 8.5 && diemSo <= 10) return 'A'
            if (diemSo >= 7 && diemSo < 8.5) return 'B'
            if (diemSo >= 5.5 && diemSo < 7) return 'C'
            if (diemSo >= 4 && diemSo < 5.5) return 'D'
            if (diemSo >= 0 && diemSo < 4) return 'F'
            return null
        }

        const tinhTuoi = () => {
            const namSinhNhap = document.getElementById('yearBorn').value.trim()
            const hienTai = new Date().getFullYear()
            const namSinh = Number(namSinhNhap)
            const ketQua = document.getElementById('age')

            if (namSinhNhap === '') {
                ketQua.textContent = 'Vui lòng nhập năm sinh'
                return
            }

            if (!Number.isInteger(namSinh) || namSinh < 1 || namSinh > hienTai) {
                ketQua.textContent = `Năm sinh phải là số nguyên từ 1 đến ${hienTai}`
                return
            }

            ketQua.textContent = hienTai - namSinh
        }
