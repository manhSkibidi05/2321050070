<html>
    <head>
        <style>
            div{
                margin-bottom: 20px;
                padding: 20px 10px;
            }
            .khoi1{
                background: green;
            }
            .khoi2{
                background: blue;
            }
            .khoi3{
                background: red;
            }
        </style>
        <title>Bai 6</title>
    </head>
    <body>
        <!-- margin : Khoảng cách giữa phần tử đang chọn với các phần tử còn lại
            padding : Khoảng cách giữa phần content của phần tử đang chọn
        -->
        <div class="khoi1">1</div>
        <div class="khoi2">2</div>
        <div class="khoi3">3</div>

        <!-- display : flex -->
        <div style="display : flex">
            <div class="khoi1">1</div>
            <div class="khoi2">2</div>
            <div class="khoi3">3</div>
        </div>
    </body>
</html>
