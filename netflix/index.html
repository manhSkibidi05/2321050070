        body {

        header,

            align-items: center;
        }

        header {

        }

        }

            text-decoration: none;
            color: #dbdbdd;
            padding: 8px 10px;
        }

        a.lien-ket-muc-anh {
            display: flex;
            align-items: center;
            padding: 6px 8px;
        }

        .logo {
            width: 90px;
            height: auto;
            display: block;
        }

        a.lien-ket-muc.dang-chon,

            background-color: #4e4b52;
            border-radius: 20px;
        }

        .banner {
            margin-top: 20px;
            width: 100%;
            height: 520px;
            border-radius: 16px;
        }

        .danh-sach-the-loai {
            margin-top: 20px;
        }

        .danh-sach-the-loai .the-loai {
            margin-bottom: 20px;
        }

        .ten-the-loai {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .phim {
            display: flex;
            gap: 10px;
        }

        .phim a {
            flex: 1;
            min-width: 0;
        }

        .phim img {
            display: block;
            width: 100%;
            height: 160px;
            border-radius: 8px;
            object-fit: cover;
        }

    </style>
</head>
