<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2f2c38;
            color: white;
            padding: 20px
        }

        header,
        ul,
        div.chuc-nang {
            display: flex;
            align-items: center;
        }

        header {
            justify-content: space-between;
            align-items: center;
        }

        ul {
            list-style: none;
            gap: 5px;
        }

        a.lien-ket-muc,
        .tim-kiem a {
            text-decoration: none;
            color: #dbdbdd;
            padding: 8px 10px;
        }

        a.lien-ket-muc-anh {
            display: flex;
            align-items: center;
            padding: 6px 8px;
        }

        .logo {
            width: 90px;
            height: auto;
            display: block;
        }

        a.lien-ket-muc.dang-chon,
        a.lien-ket-muc:hover {
            background-color: #4e4b52;
            border-radius: 20px;
        }

        .banner {
            margin-top: 20px;
            width: 100%;
        }

        .banner img {
            display: block;
            width: 100%;
            height: 520px;
            border-radius: 16px;
            object-fit: cover;
        }

        .danh-sach-the-loai {
            margin-top: 20px;
        }

        .danh-sach-the-loai .the-loai {
            margin-bottom: 20px;
        }

        .ten-the-loai {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .phim {
            display: flex;
            gap: 10px;
        }

        .phim a {
            flex: 1;
            min-width: 0;
        }

        .phim img {
            display: block;
            width: 100%;
            height: 160px;
            border-radius: 8px;
            object-fit: cover;

        }

        .nhan-vat {
            display: flex;
            gap: 10px;
        }

        .nhan-vat a {
            flex: 1;
            min-width: 0;
        }

        .nhan-vat img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <header>
        <nav class="danh-muc">
            <ul class="danh-sach-muc">
                <li><a class="lien-ket-muc-anh" href=""><img class="logo" src="./logo-netflix.svg"
                            alt="Netflix logo"></a></li>
                <li><a class="lien-ket-muc dang-chon" href="">Trang chủ</a></li>
                <li><a class="lien-ket-muc" href="">Nhân vật</a></li>
                <li><a class="lien-ket-muc" href="">Series</a></li>
                <li><a class="lien-ket-muc" href="">Phim</a></li>
                <li><a class="lien-ket-muc" href="">Mới & Phổ biến</a></li>
                <li><a class="lien-ket-muc" href="">Netflix của tôi</a></li>
                <li><a class="lien-ket-muc" href="">Duyệt tìm theo ngôn ngữ</a></li>
            </ul>
        </nav>
        <div class="chuc-nang">
            <div class="tim-kiem">
                <a href="">Search</a>
            </div>
            <div class="thong-tin">
                <a href=""><img src="./img/avt.jpg" style="width:50%" alt="User avatar"></a>
            </div>
        </div>
    </header>
    <main>
        <div class="banner">
            <img src="./img/banner.jpg" alt="Netflix banner">
        </div>
        <div class="danh-sach-the-loai">
            <div class="the-loai">
                <div class="ten-the-loai">
                    Có thể bạn chưa xem
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <a href=""><img src="./img/phim1.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim2.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim3.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim4.jpg" alt="Netflix banner"></a>
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai">
                    Phim hành động
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <a href=""><img src="./img/phim5.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim6.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim7.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim8.jpg" alt="Netflix banner"></a>
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai">
                    Phim hoạt hình
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <a href=""><img src="./img/phim9.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim10.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim11.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/phim12.jpg" alt="Netflix banner"></a>
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai">
                    Nhân vật nổi bật
                </div>
                <div class="danh-sach-nhan-vat">
                    <div class="nhan-vat">
                        <a href=""><img src="./img/nhanvat1.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/nhanvat2.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/nhanvat3.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/nhanvat4.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/nhanvat5.jpg" alt="Netflix banner"></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
