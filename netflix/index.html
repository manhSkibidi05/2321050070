<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2f2c38;
            color: white;
            padding: 20px
        }

        header,
        ul,
        div.chuc-nang {
            display: flex;
            align-items: center;
        }

        header {
            justify-content: space-between;
            align-items: center;
        }

        ul {
            list-style: none;
            gap: 5px;
        }

        a.lien-ket-muc,
        .tim-kiem a {
            text-decoration: none;
            color: #dbdbdd;
            padding: 8px 10px;
        }

        a.lien-ket-muc-anh {
            display: flex;
            align-items: center;
            padding: 6px 8px;
        }

        .logo {
            width: 90px;
            height: auto;
            display: block;
        }

        a.lien-ket-muc.dang-chon,
        a.lien-ket-muc:hover {
            background-color: #4e4b52;
            border-radius: 20px;
        }

        .banner {
            margin-top: 20px;
            width: 100%;
        }

        .banner img {
            display: block;
            width: 100%;
            height: 520px;
            border-radius: 16px;

        }

        .danh-sach-the-loai {
            margin-top: 20px;
        }

        .danh-sach-the-loai .the-loai {
            margin-bottom: 20px;
        }

        .ten-the-loai {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .phim {
            display: flex;
            gap: 10px;
        }

        .phim a {
            flex: 1;
            min-width: 0;
        }

        .phim img {
            display: block;
            width: 100%;
            height: 160px;
            border-radius: 8px;
            object-fit: cover;
        }

        .nhan-vat {
            display: flex;
            gap: 10px;
        }

        .nhan-vat a {
            flex: 1;
            min-width: 0;
        }

        .nhan-vat img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <header>
        <nav class="danh-muc">
            <ul class="danh-sach-muc">
                <li><a class="lien-ket-muc-anh" href=""><img class="logo" src="./logo-netflix.svg"
                            alt="Netflix logo"></a></li>
                <li><a class="lien-ket-muc dang-chon" href="">Trang chủ</a></li>
                <li><a class="lien-ket-muc" href="">Nhân vật</a></li>
                <li><a class="lien-ket-muc" href="">Series</a></li>
                <li><a class="lien-ket-muc" href="">Phim</a></li>
                <li><a class="lien-ket-muc" href="">Mới & Phổ biến</a></li>
                <li><a class="lien-ket-muc" href="">Netflix của tôi</a></li>
                <li><a class="lien-ket-muc" href="">Duyệt tìm theo ngôn ngữ</a></li>
            </ul>
        </nav>
        <div class="chuc-nang">
            <div class="tim-kiem">
                <a href="">Search</a>
            </div>
            <div class="thong-tin">
                <a href=""><img src="./img/avt.jpg" style="width:50%" alt="User avatar"></a>
            </div>
        </div>
    </header>
    <main>
        <div class="banner">
            <img onClick="test()" src="./img/banner.jpg" alt="Netflix banner">
        </div>
        <div class="danh-sach-the-loai">
            <div class="the-loai">
                <div class="ten-the-loai">
                    Có thể bạn chưa xem
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <a href=""><img class="aFilm" src="./img/phim1.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim2.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim3.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim4.jpg" alt="Netflix banner"></a>
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai">
                    Phim hành động
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <a href=""><img class="aFilm" src="./img/phim5.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim6.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim7.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim8.jpg" alt="Netflix banner"></a>
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai">
                    Phim hoạt hình
                </div>
                <div class="danh-sach-phim">
                    <div class="phim">
                        <a href=""><img class="aFilm" src="./img/phim9.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim10.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim11.jpg" alt="Netflix banner"></a>
                        <a href=""><img class="aFilm" src="./img/phim12.jpg" alt="Netflix banner"></a>
                    </div>
                </div>
            </div>
            <div class="the-loai">
                <div class="ten-the-loai">
                    Nhân vật nổi bật
                </div>
                <div class="danh-sach-nhan-vat">
                    <div class="nhan-vat">
                        <a href=""><img src="./img/nhanvat1.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/nhanvat2.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/nhanvat3.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/nhanvat4.jpg" alt="Netflix banner"></a>
                        <a href=""><img src="./img/nhanvat5.jpg" alt="Netflix banner"></a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const banner = document.querySelector('.banner')
        
        const listFilm = [
            {
                id : 1,
                name : 'Phim 1',
                thoiLuong : '1p',
                banner : './img/phim1.jpg'
            },
            {
                id : 2,
                name : 'Phim 2',
                thoiLuong : '2p',
                banner : './img/phim2.jpg'
            },
            {
                id : 3,
                name : 'Phim 3',
                thoiLuong : '3p',
                banner : './img/phim3.jpg'
            },
            {
                id : 4,
                name : 'Phim 4',
                thoiLuong : '4p',
                banner : './img/phim4.jpg'
            },
            {
                id : 5,
                name : 'Phim 5',
                thoiLuong : '5p',
                banner : './img/phim5.jpg'
            },
            {
                id : 6,
                name : 'Phim 6',
                thoiLuong : '6p',
                banner : './img/phim6.jpg'
            },
            {
                id : 7,
                name : 'Phim 7',
                thoiLuong : '7p',
                banner : './img/phim7.jpg'
            },
            {
                id : 8,
                name : 'Phim 8',
                thoiLuong : '8p',
                banner : './img/phim8.jpg'
            },
            {
                id : 9,
                name : 'Phim 9',
                thoiLuong : '9p',
                banner : './img/phim9.jpg'
            },
            {
                id : 10,
                name : 'Phim 10',
                thoiLuong : '10p',
                banner : './img/phim10.jpg'
            },
            {
                id : 11,
                name : 'Phim 11',
                thoiLuong : '11p',
                banner : './img/phim11.jpg'
            },
            {
                id : 12,
                name : 'Phim 12',
                thoiLuong : '12p',
                banner : './img/phim12.jpg'
            }
        ]
        const films = document.querySelectorAll('.aFilm')

        films.forEach((film, index) => {
            film.addEventListener('click', (e) => {
                e.preventDefault()
                const bannerImg = document.createElement('img')
                bannerImg.setAttribute('alt', 'Netflix banner')
                bannerImg.setAttribute('src', listFilm[index].banner)
                banner.innerHTML = ''
                banner.appendChild(bannerImg)
            })
        })

        const test = () => {
            banner.innerHTML = '<iframe width="100%" height="520" src="https://www.youtube.com/embed/BTMMQZNthzk?si=bxeNBMyKF31wFmIb" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'
        }
    </script>
</body>

</html>
